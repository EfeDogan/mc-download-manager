<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>MC Download Manager promo</title>
<style>
  :root {
    --bg: #090e20; --cyan: #6fd3ff; --blue: #2f7bf6; --violet: #a78bfa; --green: #34d399;
    --amber: #fbbf24; --red: #f87171; --text: #f4f7ff; --muted: #9aa7c7; --line: rgba(255,255,255,.13);
  }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  body { font-family: -apple-system, "SF Pro Display", "Helvetica Neue", system-ui, sans-serif; color: var(--text);
         -webkit-font-smoothing: antialiased; font-feature-settings: "tnum" 0; }
  #stage { position: absolute; inset: 0; overflow: hidden; }
  .abs { position: absolute; }
  .scene { position: absolute; inset: 0; display: none; transform-origin: 50% 50%; }
  .card { position: absolute; border-radius: 28px; border: 1px solid var(--line);
          background: linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.035));
          box-shadow: 0 40px 90px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.09); }
  .solid { background: linear-gradient(180deg, #1f2742, #161d33); }
  .headline { position: absolute; left: 0; right: 0; top: 110px; text-align: center; font-size: 80px; font-weight: 800;
              letter-spacing: -2px; line-height: 1.05; white-space: nowrap; }
  .subline { position: absolute; left: 0; right: 0; text-align: center; font-size: 40px; font-weight: 600; color: #b9c6e6;
             letter-spacing: -.3px; white-space: nowrap; }
  .word { display: inline-block; white-space: pre; }
  .grad { background: linear-gradient(95deg, #9be8ff 0%, #56a8ff 55%, #b39dff 100%); -webkit-background-clip: text;
          background-clip: text; color: transparent; padding-bottom: .08em; }
  .pill { position: absolute; padding: 0 30px; height: 64px; line-height: 64px; border-radius: 32px; font-size: 30px; font-weight: 700;
          background: rgba(111,211,255,.12); border: 1px solid rgba(111,211,255,.35); color: #dff6ff; white-space: nowrap; }
  .mono { font-family: "SF Mono", Menlo, monospace; }
  .muted { color: var(--muted); }
  .bar { position: absolute; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px;
          background: linear-gradient(90deg, #2f7bf6, #6fd3ff); box-shadow: 0 0 18px rgba(111,211,255,.55); }
  .traffic { position: absolute; display: flex; gap: 10px; }
  .traffic i { width: 16px; height: 16px; border-radius: 50%; display: block; }
  .row { position: absolute; display: flex; align-items: center; gap: 16px; white-space: nowrap; }
  .key { position: absolute; width: 96px; height: 96px; border-radius: 20px; background: linear-gradient(180deg,#3a4466,#252d48);
         border: 1px solid rgba(255,255,255,.18); box-shadow: 0 8px 0 #141a2e, 0 14px 30px rgba(0,0,0,.5);
         font-size: 46px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
  .btn { position: absolute; border-radius: 14px; font-weight: 650; display: flex; align-items: center; justify-content: center; white-space: nowrap; }
</style>
</head>
<body>
<!-- shared defs live outside display:none subtrees so gradients/filters always resolve -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="iconBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b4673"/><stop offset="1" stop-color="#171f3e"/></linearGradient>
    <linearGradient id="cyanBlue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f7bf6"/><stop offset="1" stop-color="#6fd3ff"/></linearGradient>
    <linearGradient id="folder" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc4ff"/><stop offset="1" stop-color="#2f86f0"/></linearGradient>
    <linearGradient id="videoArt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b1d6e"/><stop offset=".55" stop-color="#1d3f8f"/><stop offset="1" stop-color="#0f7aa8"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
</svg>

<div id="stage">
  <div id="bg" class="abs" style="inset:0"></div>
  <div id="tint" class="abs" style="inset:0;background:radial-gradient(70% 60% at 50% 55%, rgba(248,113,113,.22), transparent 70%)"></div>

      <mask id="gridMask"><rect width="1920" height="1080" fill="url(#gridMaskG)"/></mask>
    </defs>
    <g mask="url(#gridMask)"><rect id="gridRect" x="-80" y="-80" width="2080" height="1240" fill="url(#gridp)"/></g>
  </svg>
  <div id="particles" class="abs" style="inset:0"></div>
  <div id="scenes" class="abs" style="inset:0"></div>

  <div id="fade" class="abs" style="inset:0;background:#05070f;opacity:0"></div>
</div>

<script>
// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eo5 = (x) => 1 - Math.pow(1 - x, 5);
const eio = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eb = (x) => { const c1 = 1.9, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

function el(parent, cls = "", style = "", html = "") {
  const d = document.createElement("div");
  if (cls) d.className = cls;
  if (style) d.style.cssText = style;
  if (html) d.innerHTML = html;
  parent.appendChild(d);
  return d;
}
function st(e, { o = 1, x = 0, y = 0, s = 1, sx = null, r = 0, b = 0 } = {}) {
  e.style.opacity = o;
  e.style.transform = `translate(${x}px,${y}px) scale(${sx === null ? s : sx + "," + s}) rotate(${r}deg)`;
  e.style.filter = b > .05 ? `blur(${b}px)` : "none";
}
// words with {gradient} markup → spans
function words(e, text) {
  let grad = false;
  const parts = text.split(" ").map((w) => {
    let cls = "word";
    if (w.startsWith("{")) { grad = true; w = w.slice(1); }
    const close = w.endsWith("}") || /}[.,?!]*$/.test(w);
    if (grad) cls += " grad";
    w = w.replace("}", "");
    if (close) grad = false;
    return `<span class="${cls}">${w}</span>`;
  });
  e.innerHTML = parts.join(" ");
  return [...e.children];
}
function reveal(spans, lt, a, stagger = .065, dur = .55, dist = 46) {
  spans.forEach((sp, i) => {
    const p = eo(P(lt, a + i * stagger, a + i * stagger + dur));
    st(sp, { o: p, y: (1 - p) * dist, b: (1 - p) * 12 });
  });
}
// a stack of headlines, line i visible from times[i] until times[i+1]
function heads(root, texts, top = 110, size = 80) {
  return texts.map((tx) => {
    const d = el(root, "headline", `top:${top}px;font-size:${size}px`);
    return { e: d, spans: words(d, tx) };
  });
}
function renderHeads(hs, lt, times) {
  hs.forEach((h, i) => {
    const a = times[i], b = times[i + 1];
    if (lt < a - .02) { h.e.style.opacity = 0; return; }
    reveal(h.spans, lt, a);
    const q = b === undefined ? 0 : eio(P(lt, b - .32, b + .05));
    h.e.style.opacity = 1 - q;
    h.e.style.transform = `translateY(${-q * 46}px)`;
    h.e.style.filter = q > .02 ? `blur(${q * 10}px)` : "none";
  });
}
const fmt = (x, d = 1) => x.toFixed(d).replace(".", L.dec);

}

  battery: `<svg width="40" height="22" viewBox="0 0 40 22"><rect x="1" y="2" width="33" height="18" rx="5" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="1.6"/><rect x="4" y="5" width="24" height="12" rx="2.5" fill="#fff"/><rect x="35.5" y="8" width="2.5" height="6" rx="1.2" fill="#fff" fill-opacity=".7"/></svg>`,

// time of a word inside the narration (character-proportional within its sentence)
function at(s, needle, fallback = 0) {
  const n = needle.toLocaleLowerCase();
  for (let k = 0; k < s.sentences.length; k++) {
    const text = s.sentences[k].toLocaleLowerCase();
    const i = text.indexOf(n);
    if (i < 0) continue;
    const a = s.c[k], b = k + 1 < s.c.length ? s.c[k + 1] - .2 : s.v + s.vd;
    return a + (i / text.length) * (b - a);
  }
  return fallback;
}

      } else f = fT;
      const throttled = lt >= tT && i >= 8 && (i >= 12 || lt < tA + .2);
      const amber = throttled ? P(lt, tT, tT + .35) * (i < 12 ? 1 - P(lt, tA, tA + .3) : 1) : 0;
      st(L_.lane, { o: appear * (1 - amber * .45), sx: appear, s: 1 });

      p.setAttribute("stroke-dasharray", `14 10`);
      p.setAttribute("stroke-dashoffset", `${-lt * 90}`);
      p.style.opacity = appear * (f >= 1 ? .25 : .75) * (1 - amber * .7);
      sum += f;
      if (appear > .5 && !(lt >= tT && dropped) && f < 1) active++;
    });
    const doneAll = sum / this.N;
    const conns = lt < tT ? active : Math.round(lerp(16, 8, P(lt, tT, tT + .6)) + (lt >= tA ? 4 * P(lt, tA, tA + .4) : 0));
    const speed = (lt < tSplit ? 2.1 : lt < tT ? lerp(2.1, 31.6, eo(P(lt, tSplit, tSplit + 1.2))) :
                   lt < tA ? lerp(31.6, 11.8, eo(P(lt, tT, tT + .5))) : lerp(11.8, 24.4, eo(P(lt, tA, tA + .6)))) * (1 + .035 * Math.sin(lt * 11));
    const sv = eo(P(lt, .4, 1));

    this.stats[0].v.style.color = lt >= tT && lt < tA + .3 ? "#fbbf24" : "#fff";
    this.stats[1].v.textContent = `${fmt(speed)} ${L.seg.unit}`;
    this.stats[2].v.textContent = `${Math.round(doneAll * 100)}%`;
    // 429 badge → adapted
    const bIn = eb(P(lt, tT, tT + .4)), ok = lt >= tA;

  },
};

    this.langs = langs.map(([name, items], i) => {
      const c = el(r, "card solid", `left:${520 + i * 460}px;top:330px;width:420px;height:420px`);
      el(c, "abs", "left:30px;top:28px;font-size:30px;font-weight:800;color:#9be8ff", name);
      const gl = [glyph.folder, glyph.image, glyph.music, glyph.video];
      items.forEach((it, k) => el(c, "row", `left:36px;top:${100 + k * 72}px;font-size:30px;font-weight:600;color:#dbe4ff`, `<span style="color:#7cc4ff;display:flex">${gl[k]}</span>${it}`));
      return c;
    });
    // final lockup
    this.fIcon = el(r, "abs", "left:830px;top:190px;width:260px;height:260px", iconSVG(260));
    this.fHalo = el(r, "abs", "left:660px;top:20px;width:600px;height:600px;border-radius:50%;background:radial-gradient(closest-side, rgba(111,211,255,.35), transparent)");
    r.insertBefore(this.fHalo, this.fIcon);
    this.fName = el(r, "abs", "left:0;right:0;top:486px;text-align:center;font-size:104px;font-weight:800;letter-spacing:-3px", "MC Download Manager");
    this.fTag = el(r, "subline", "top:620px;font-size:40px", L.out.tagline);
    this.fUrl = el(r, "abs", "left:0;top:712px;height:84px;padding:0 38px;border-radius:42px;display:flex;align-items:center;gap:16px;font-size:38px;font-weight:700;white-space:nowrap;" +
      "background:linear-gradient(90deg,rgba(47,123,246,.3),rgba(111,211,255,.18));border:1px solid rgba(111,211,255,.5);box-shadow:0 0 40px rgba(111,211,255,.25);color:#e6f6ff",
      `<span style="display:flex;color:#9be8ff">${glyph.code}</span><span class="mono" style="font-size:34px">${L.out.url}</span>`);
  },
  layout() { this.fUrl.style.left = `${960 - this.fUrl.offsetWidth / 2}px`; },
  render(lt, s) {
    const [c0, c1, c2, c3] = s.c;
    renderHeads(this.h.slice(0, 3), lt, [c0 - .1, c1 - .1, c2 - .1, c3 - .15]);
    // DMG window
    const wi = eo(P(lt, .05, .7)), wo = eio(P(lt, c2 - .3, c2 + .2));
    st(this.dmg, { o: wi * (1 - wo), y: (1 - wi) * 80 + wo * 60, s: 1 - wo * .06, b: wo * 8 });
    const g0 = c1 + .15, g1 = c1 + .45, g2 = Math.min(c1 + 1.6, c2 - .5);
    const drag = eio(P(lt, g1, g2));
    const lifted = P(lt, g1 - .05, g1 + .1) * (1 - P(lt, g2, g2 + .15));
    const iconX = drag * 500, iconY = Math.sin(Math.PI * drag) * -60;
    const dropS = 1 - .55 * P(lt, g2, g2 + .25);
    st(this.appIcon, { o: lt > g2 + .2 ? 1 - P(lt, g2 + .1, g2 + .3) * .6 : 1, x: iconX, y: iconY, s: (1 + lifted * .06) * (lt > g2 ? dropS : 1) });
    if (lt > g2 + .2) st(this.appIcon, { o: .35, x: 0, y: 0, s: 1 });
    this.appIcon.style.filter = lifted > .1 ? `drop-shadow(0 30px 30px rgba(0,0,0,.6))` : "none";
    const fb = Math.sin(Math.PI * P(lt, g2, g2 + .4));
    this.folder.style.transform = `scale(${1 + fb * .1})`;
    st(this.okBadge, { o: P(lt, g2 + .15, g2 + .25), s: eb(P(lt, g2 + .15, g2 + .55)) });
    this.arrowEl.style.opacity = .3 + .7 * (Math.sin(lt * 5) * .5 + .5);
    // cursor on the app icon → folder (window left 440, top 290; icon centre 270,270)
    if (lt > g0 - .7 && lt < g2 + .6) {
      const m = eio(P(lt, g0 - .7, g0 + .2));
      const ix = 440 + 270 + 30, iy = 290 + 270 + 20;
      showCursor(lerp(1500, ix, m) + iconX, lerp(980, iy, m) + iconY, lifted * .6);
      cursor.style.opacity = 1 - P(lt, g2 + .3, g2 + .6);
    }
    // language cards
    this.langs.forEach((c, i) => {
      const t0 = c2 + .05 + i * .15, p = eb(P(lt, t0, t0 + .5)), o = eio(P(lt, c3 - .35, c3 + .1));
      st(c, { o: P(lt, t0, t0 + .15) * (1 - o), s: (.7 + .3 * p) * (1 - o * .1), y: (1 - p) * 40 - o * 40, b: o * 8 });
    });
    // lockup
    const f0 = c3 - .1;
    const fi = eb(P(lt, f0, f0 + .7));
    st(this.fIcon, { o: P(lt, f0, f0 + .2), s: .5 + .5 * fi });
    st(this.fHalo, { o: P(lt, f0 + .2, f0 + 1) * (.6 + .2 * Math.sin(lt * 2)), s: .9 + .1 * Math.sin(lt * 1.3) });
    const n1 = eo(P(lt, f0 + .25, f0 + .85));
    st(this.fName, { o: n1, y: (1 - n1) * 40, b: (1 - n1) * 10 });
    const n2 = eo(P(lt, f0 + .55, f0 + 1.1));
    st(this.fTag, { o: n2, y: (1 - n2) * 30 });
    const n3 = eb(P(lt, f0 + .8, f0 + 1.3));
    st(this.fUrl, { o: P(lt, f0 + .8, f0 + .95), s: .7 + .3 * n3 });
  },
};

// ---------- background ----------
const bg = document.getElementById("bg");
const particles = [];
function buildBackground() {
  const R = rng(42);
  for (let i = 0; i < 60; i++) {
    const p = el(document.getElementById("particles"), "abs", `width:${2 + R() * 4}px;height:${2 + R() * 4}px;border-radius:50%;background:#9fdcff`);
    particles.push({ p, x: R() * 1920, y: R() * 1080, vx: (R() - .5) * 14, vy: 8 + R() * 22, ph: R() * 6.28, a: .15 + R() * .45 });
  }
}
function renderBackground(t) {
  const b1x = 30 + 12 * Math.sin(t * .13), b1y = 30 + 10 * Math.cos(t * .11);
  const b2x = 72 + 10 * Math.cos(t * .09), b2y = 70 + 8 * Math.sin(t * .12);
  const b3x = 55 + 20 * Math.sin(t * .07 + 2), b3y = 15 + 10 * Math.sin(t * .1);
  bg.style.background = `radial-gradient(45% 55% at ${b1x}% ${b1y}%, rgba(47,90,220,.42), transparent 70%),
    radial-gradient(40% 50% at ${b2x}% ${b2y}%, rgba(20,150,210,.30), transparent 70%),
    radial-gradient(35% 40% at ${b3x}% ${b3y}%, rgba(130,80,230,.24), transparent 70%),
    linear-gradient(180deg, #0b1230, #070b1c)`;
  document.getElementById("gridRect").setAttribute("transform", `translate(${(t * 6) % 80} ${(t * 10) % 80})`);
  particles.forEach((q) => {
    const x = ((q.x + t * q.vx) % 1920 + 1920) % 1920, y = ((q.y - t * q.vy) % 1080 + 1080) % 1080;
    q.p.style.transform = `translate(${x}px,${y}px)`;
    q.p.style.opacity = q.a * (.6 + .4 * Math.sin(t * 1.3 + q.ph));
  });
}

// ---------- timeline ----------
let TL = null;
window.setup = (timeline) => {
  TL = timeline;
  L = I18N[timeline.lang];
  buildBackground();
  const root = document.getElementById("scenes");
  TL.scenes.forEach((s, i) => {
    s.D = s.end - s.start;
    s.v = s.voiceStart - s.start;
    s.vd = s.voiceDur;
    s.c = s.cues.map((c) => c - s.start);
    s.first = i === 0; s.last = i === TL.scenes.length - 1;
    s.root = el(root, "scene");
    s.impl = Object.create(S[s.id]);
    s.impl.build(s.root, s);
  });
  // measure-dependent layout
  TL.scenes.forEach((s) => { s.root.style.display = "block"; s.impl.layout?.(); s.root.style.display = "none"; });
  const wm = document.getElementById("watermark");
  wm.innerHTML = iconSVG(44) + "<span>MC Download Manager</span>";
  return document.fonts.ready.then(() => true);
};

window.render = (t) => {
  renderBackground(t);
  cursor.style.display = "none"; cursor.style.opacity = 1; cursorSet = false;
  const hook = TL.scenes[0];
  document.getElementById("tint").style.opacity = 1 - P(t, hook.end - .6, hook.end + .4);
  TL.scenes.forEach((s) => {
    const lt = t - s.start;
    const visible = lt >= -0.001 && lt <= s.D + .4;
    s.root.style.display = visible ? "block" : "none";
    if (!visible) return;
    const inP = s.first ? 1 : eo(P(lt, 0, .4));
    const outP = s.last ? 0 : eio(P(lt, s.D - .12, s.D + .38));   // overlaps the next scene's entrance
    s.root.style.opacity = inP * (1 - outP);
    s.root.style.transform = `scale(${(.95 + .05 * inP) * (1 + .05 * outP)})`;
    const blur = (1 - inP) * 14 + outP * 14;
    s.root.style.filter = blur > .1 ? `blur(${blur}px)` : "none";
    s.impl.render(lt, s);
  });
  const intro = TL.scenes[1], outro = TL.scenes[TL.scenes.length - 1];
  const wm = P(t, intro.end, intro.end + .6) * (1 - P(t, outro.cues[3] - .6, outro.cues[3] - .2));
  document.getElementById("watermark").style.opacity = wm * .6;
  document.getElementById("fade").style.opacity = P(t, TL.total - .5, TL.total);
};

// preview in a normal browser: motion.html?lang=tr&t=12.5  (needs out/timeline_<lang>.json served next to it)
if (!navigator.webdriver) {
  const q = new URLSearchParams(location.search);
  fetch(`out/timeline_${q.get("lang") || "en"}.json`).then((r) => r.json()).then(async (tl) => {
    await setup(tl);
    if (q.has("t")) return render(+q.get("t"));
    const t0 = performance.now();
    const loop = () => { render(((performance.now() - t0) / 1000) % tl.total); requestAnimationFrame(loop); };
    loop();
  }).catch(() => {});
}
</script>
