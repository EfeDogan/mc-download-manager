name: Build DMG

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app || true
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Fetch bundled tools (yt-dlp, ffmpeg)
        run: scripts/fetch-tools.sh
      - name: Build DMG (ad-hoc signed)
        run: scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MC-Download-Manager-dmg
          path: build/*.dmg
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.dmg
