name: Cross-platform core

on:
  push:
    branches: [main]
    tags: ["cross-platform-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: CrossPlatform
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CrossPlatform/app/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: CrossPlatform
      - name: Fetch pinned video tool
        if: runner.os != 'macOS'
        shell: bash
        run: ./scripts/fetch-cross-platform-tools.sh ${{ runner.os == 'Windows' && 'x86_64-pc-windows-msvc' || 'x86_64-unknown-linux-gnu' }}
        working-directory: ${{ github.workspace }}
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
        working-directory: .
      - name: Install frontend dependencies
        run: npm ci
        working-directory: CrossPlatform/app
      - name: Build frontend
        run: npm run build
        working-directory: CrossPlatform/app
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-installers
            bundles: deb,appimage
            paths: |
              CrossPlatform/target/release/bundle/deb/*.deb
              CrossPlatform/target/release/bundle/appimage/*.AppImage
          - os: windows-latest
            artifact: windows-installers
            bundles: msi,nsis
            paths: |
              CrossPlatform/target/release/bundle/msi/*.msi
              CrossPlatform/target/release/bundle/nsis/*-setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CrossPlatform/app/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: CrossPlatform
      - name: Fetch pinned video tool
        shell: bash
        run: ./scripts/fetch-cross-platform-tools.sh ${{ runner.os == 'Windows' && 'x86_64-pc-windows-msvc' || 'x86_64-unknown-linux-gnu' }}
        working-directory: ${{ github.workspace }}
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install frontend dependencies
        run: npm ci
        working-directory: CrossPlatform/app
      - name: Build native installers
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}
        working-directory: CrossPlatform/app
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/cross-platform-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: built-assets
      - name: Prepare release assets and checksums
        shell: bash
        run: |
          mkdir release-assets
          while IFS= read -r -d '' asset; do
            filename="$(basename "$asset")"
            safe_name="${filename// /.}"
            cp "$asset" "release-assets/$safe_name"
          done < <(find built-assets -type f -print0)
          cd release-assets
          sha256sum MC.Download.Manager_* > SHA256SUMS.txt
      - name: Publish cross-platform preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0 | sort -z)
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "MC Download Manager $GITHUB_REF_NAME" \
            --notes-file - <<'EOF'
          Experimental Linux and Windows preview.

          Recommended downloads:
          - Windows: the file ending in `x64-setup.exe`
          - Linux: the file ending in `amd64.AppImage` or `amd64.deb`

          The Linux build has been manually exercised on Ubuntu. Windows packages
          are built and tested in CI but have not yet been verified on a real Windows
          installation. Packages are not code-signed.
          EOF
